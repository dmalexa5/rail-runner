rail_teleop:
  serial:
    port:
      type: string
      default_value: "/dev/ttyUSB0"
      description: "Serial device connected to the teleop controller."
      read_only: true
  command_topic:
    type: string
    default_value: "rail_velocity"
    description: "Topic on which joystick velocity setpoints are published."
    read_only: true
  scale:
    type: double
    default_value: 1.0
    description: "Multiplier applied to received joystick setpoints."
    read_only: true
    validation:
      gt<>: [0.0]
