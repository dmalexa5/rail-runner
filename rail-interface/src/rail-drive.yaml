rail_drive:
  serial:
    port:
      type: string
      default_value: "/dev/ttyACM0"
      description: "Serial device connected to the drive controller."
      read_only: true
  joint_name:
    type: string
    default_value: "rail_joint"
    description: "Joint name used in published JointState messages."
    read_only: true
  command_topic:
    type: string
    default_value: "rail_velocity"
    description: "Topic from which velocity setpoints are received."
    read_only: true
  state_topic:
    type: string
    default_value: "rail_state"
    description: "Topic on which rail joint state is published."
    read_only: true
  calibration_timeout:
    type: double
    default_value: 60.0
    description: "Maximum calibration duration in seconds."
    read_only: true
    validation:
      gt<>: [0.0]
